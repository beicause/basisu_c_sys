name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # runtime is normally 10 minutes
    timeout-minutes: 30
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Recreate vendored symlinks (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          # The superproject checkout happens before the submodules are
          # populated, so git materializes the vendored symlinks as file-type
          # links (or plain files). Windows then fails to traverse them
          # ("permission denied" when the build reads through them). Recreate
          # them now that the submodules are in place, so git creates
          # directory links.
          git config core.symlinks true
          recreate_symlinks() {
            local root="$1"
            shift
            rm -rf "$root"
            git checkout -- "$root"
            for link in "$@"; do
              if ! test -d "$root/$link"; then
                echo "::error::vendored symlink $root/$link is not traversable on Windows"
                exit 1
              fi
            done
          }
          recreate_symlinks crates/basisu_c_sys/vendored/basis_universal encoder transcoder zstd
          recreate_symlinks crates/basisu_wasm_libcxx/vendored/musl include src
          recreate_symlinks crates/basisu_wasm_libcxx/vendored/emscripten/system/lib \
            compiler-rt libc_musl_arch_emscripten libcxx libcxxabi llvm-libc

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/install-linux-deps

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Clippy `no_std`
        run: cargo clippy -p basisu_c_sys --no-default-features --features transcode_default -- -Dwarnings

      - name: Clippy all features
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build ${{matrix.os}}
        run: cargo build --workspace --all-targets

  test:
    name: Test ${{matrix.os}}
    # runtime is normally 25 minutes
    timeout-minutes: 60
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Recreate vendored symlinks (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          # The superproject checkout happens before the submodules are
          # populated, so git materializes the vendored symlinks as file-type
          # links (or plain files). Windows then fails to traverse them
          # ("permission denied" when the build reads through them). Recreate
          # them now that the submodules are in place, so git creates
          # directory links.
          git config core.symlinks true
          recreate_symlinks() {
            local root="$1"
            shift
            rm -rf "$root"
            git checkout -- "$root"
            for link in "$@"; do
              if ! test -d "$root/$link"; then
                echo "::error::vendored symlink $root/$link is not traversable on Windows"
                exit 1
              fi
            done
          }
          recreate_symlinks crates/basisu_c_sys/vendored/basis_universal encoder transcoder zstd
          recreate_symlinks crates/basisu_wasm_libcxx/vendored/musl include src
          recreate_symlinks crates/basisu_wasm_libcxx/vendored/emscripten/system/lib \
            compiler-rt libc_musl_arch_emscripten libcxx libcxxabi llvm-libc

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/install-linux-deps

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # The `wasm` test is excluded: it only runs in the `test-wasm` job on
      # wasm32-unknown-unknown. Run the lib unit tests (including the
      # `basisu_wasm_libcxx` allocator/signal shims, which compile natively
      # for exactly this purpose) plus the native `encoder`/`transcoder`
      # integration tests instead.
      - name: Test ${{matrix.os}}
        run: cargo test -p basisu_c_sys -p basisu_wasm_libcxx --all-features --release --lib --test encoder --test transcoder

  build-wasm:
    name: Build and test wasm
    # runtime is normally 10 minutes
    timeout-minutes: 30
    # ubuntu-26.04 (preview) ships clang 21 by default, which satisfies the
    # vendored emscripten libc++ requirement (clang >= 19).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32v1-none

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Clippy `no_std`
        run: cargo clippy -p basisu_c_sys --no-default-features --features transcode_default -- -Dwarnings

      - name: Clippy all features
        run: cargo clippy --workspace --target wasm32-unknown-unknown --all-targets --all-features -- -Dwarnings

      # The insta-based encoder/transcoder integration tests cannot run on
      # wasm (snapshot I/O is stubbed and the libtest harness cannot report
      # pass/fail), so only the `wasm` test is run here. It has
      # `harness = false` and its own `_start` entry that traps on failure,
      # which wasmtime reports as a non-zero exit code.
      - name: Test wasm with wasmtime
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "wasmtime run"
        run: cargo test -p basisu_c_sys --test wasm --all-features --target wasm32-unknown-unknown

      # Bare-metal wasm (wasm32v1-none) has no `std`, so only `basisu_c_sys`
      # and `basisu_wasm_libcxx` build there; the bevy-based crates and tests
      # (which need std / the test harness) cannot compile for it.
      - name: Build wasm bare-metal
        run: cargo build -p basisu_c_sys --no-default-features --features transcode_default --target wasm32v1-none

      # `--all-targets` would also build the tests and test_processor, which
      # are not expected to support wasm. Build only the wasm-capable example
      # here; the `wasm` test (whose link step is the regression test for the
      # vendored libc symbols the encoder C++ pulls in) is built and run by
      # the `test-wasm` job below.
      - name: Build wasm
        run: cargo build -p test_scene --target wasm32-unknown-unknown

  build-android:
    name: Build android
    # runtime is normally 5 minutes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile=minimal
          rustup target add aarch64-linux-android

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-android-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install Android NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'ndk;${{env.ANDROID_NDK_VERSION}}'

      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk

      - name: Build
        run: >
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{env.ANDROID_NDK_VERSION}}
          && export ANDROID_NDK_ROOT=${ANDROID_NDK_HOME}
          && cargo ndk-env -t arm64-v8a
          && cargo ndk -t arm64-v8a -P 26 build --features bevy/android-game-activity

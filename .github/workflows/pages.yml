name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  merge_group:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CACHE_SUFFIX: e # cache busting

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # ubuntu-26.04 (preview) ships clang 21 by default, which satisfies the
    # vendored emscripten libc++ requirement (clang >= 19).
    runs-on: ubuntu-26.04
    # runtime is normally 10-15 minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Install wasm-opt
        run: >
          wget https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz
          && tar -xvf binaryen-version_125-x86_64-linux.tar.gz
          && sudo cp binaryen-version_125/bin/wasm-opt /usr/local/bin/
          && rm -r binaryen-version_125
          && rm binaryen-version_125-x86_64-linux.tar.gz

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup toolchain install nightly --no-self-update --profile=minimal --component rustfmt
          rustup target add wasm32-unknown-unknown
          rustup target add --toolchain nightly wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: deploy-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install wasm-bindgen
        run: cargo binstall --version ^0.2 --force wasm-bindgen-cli

      - name: Install cargo-docs-rs
        run: cargo binstall cargo-docs-rs

      - name: Build docs
        run: >
          cargo +nightly docs-rs -p basisu_c_sys
          && cp -r target/wasm32-unknown-unknown/doc pages/docs/wasm32-unknown-unknown
          && cp -r target/x86_64-unknown-linux-gnu/doc pages/docs/x86_64-unknown-linux-gnu

      - name: Build webgpu
        run: RUSTFLAGS="-Ctarget-feature=+simd128" cargo b -p test_scene --features bevy/webgpu --target wasm32-unknown-unknown --profile web_release

      - name: Wasm bindgen webgpu
        run: wasm-bindgen --out-name test_scene --out-dir pages/web/target/webgpu/ --target web target/wasm32-unknown-unknown/web_release/test_scene.wasm

      - name: Optimize wasm webgpu
        run: >
          wasm-opt --enable-simd --enable-bulk-memory-opt --enable-nontrapping-float-to-int -Os
          pages/web/target/webgpu/test_scene_bg.wasm -o pages/web/target/webgpu/test_scene_bg.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

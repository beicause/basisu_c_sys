<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="favicon.ico" />
        <style>
            body {
                background: linear-gradient(
                        135deg,
                        white 0%,
                        white 49%,
                        black 49%,
                        black 51%,
                        white 51%,
                        white 100%
                    )
                    repeat;
                background-size: 20px 20px;

                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            canvas {
                background-color: transparent;
            }
            body,
            html {
                height: 100%;
            }

            .game-container {
                width: 95%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .lds-dual-ring {
                display: inline-block;
                position: absolute;
                left: 0;
                right: 0;
                margin: auto;
                width: 80px;
                height: 80px;
            }

            .lds-dual-ring:after {
                content: " ";
                display: block;
                width: 64px;
                height: 64px;
                border-radius: 50%;
                border: 6px solid #666666;
                border-color: #666666 transparent #666666 transparent;
                animation: lds-dual-ring 1.2s linear infinite;
            }

            @keyframes lds-dual-ring {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            #bevy {
                z-index: 2;
            }
        </style>
        <title>Bevy BasisU Loader Example (WebGPU)</title>
    </head>
    <div class="game-container">
        <div class="lds-dual-ring"></div>
        <canvas id="bevy">
            Javascript and support for canvas is required
        </canvas>
    </div>
    <script type="module">
        import init from "./target/webgpu/test_scene.js";
        init();
    </script>
    <a
        href="./index.html"
        style="
            position: absolute;
            top: 12px;
            right: 3%;
            z-index: 3;
            font-size: 1.25rem;
        "
        >WebGPU demo</a
    >
    <a
        href="https://github.com/beicause/bevy_basisu_loader"
        style="
            position: absolute;
            top: 48px;
            right: 3%;
            z-index: 3;
            font-size: 1.25rem;
        "
        >Github</a
    >
</html>

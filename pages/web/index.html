<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="favicon.ico" />
        <title>WebGPU Example - bevy_basisu_loader</title>
        <style>
            :root {
                --header-height: 36px;
                --header-bg: #f5f5f7;
                --border: #e5e5e5;
                --link: #2563eb;
                --link-hover: #1d4ed8;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
                background: #ffffff;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .demo-header {
                height: var(--header-height);
                width: 100%;
                background: var(--header-bg);
                border-bottom: 1px solid var(--border);
                padding: 0 1.5rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }

            .demo-title {
                font-weight: 600;
                color: #333;
                font-size: 0.9rem;
            }

            .demo-links {
                display: flex;
                gap: 1.5rem;
            }

            .demo-links a {
                color: var(--link);
                text-decoration: none;
                font-size: 0.9rem;
                line-height: var(--header-height);
            }

            .demo-links a:hover {
                text-decoration: underline;
                color: var(--link-hover);
            }

            .game-container {
                flex: 1;
                width: calc(100% - 64px);
                overflow: hidden;
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 4px 32px 16px 32px;
                border: 1px solid rgba(0, 0, 0, 0.15);
            }

            canvas#bevy {
                background-color: transparent;
                width: 100%;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
                z-index: 2;
            }

            .lds-dual-ring {
                display: inline-block;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 48px;
                height: 48px;
                z-index: 1;
                pointer-events: none;
            }

            .lds-dual-ring:after {
                content: "";
                display: block;
                width: 36px;
                height: 36px;
                margin: 6px;
                border-radius: 50%;
                border: 3px solid #ccc;
                border-top-color: #555;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <header class="demo-header">
            <span class="demo-title"
                >🖥️ WebGPU Example - bevy_basisu_loader</span
            >
            <nav class="demo-links">
                <a href="../index.html">← Projects</a>
                <a
                    href="https://github.com/beicause/bevy_basisu_loader"
                    target="_blank"
                    >GitHub</a
                >
            </nav>
        </header>

        <div class="game-container">
            <div class="lds-dual-ring"></div>
            <canvas id="bevy"
                >Javascript and support for canvas is required</canvas
            >
        </div>

        <script type="module">
            import init from "./target/webgpu/test_scene.js";
            init();
        </script>
    </body>
</html>

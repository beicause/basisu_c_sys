[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
repository = "https://github.com/beicause/bevy_basisu_loader"
license = "MIT OR Apache-2.0"

[profile.test]
opt-level = 1

[profile.web_release]
inherits = "release"
opt-level = "s"
lto = "thin"
panic = "abort"
codegen-units = 1

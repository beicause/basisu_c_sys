[package]
name = "bevy_basisu_loader"
version = "0.6.1"
edition = "2024"
description = "Provides a lightweight, cross-platform KTX2 Basis Universal texture loader for Bevy"
repository.workspace = true
license.workspace = true
keywords = ["asset", "basis-universal", "bevy", "transcoder"]

[dependencies]
basisu_c_sys = {
  path = "../basisu_c_sys",
  version = "0.8",
  default-features = false,
  features = [
    "extra",
    "serde",
  ]
}

async-lock = "3.4.2"
bevy = {
  workspace = true,
  features = [
    "bevy_asset",
    "bevy_image",
    "bevy_log",
    "bevy_render",
  ]
}
bitflags = "2.11.0"
log = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
insta = "1.47.2"

[features]
default = [
  "transcode_astc",
  "transcode_etc1s_bc4_5",
  "transcode_etc1s_bc7",
  "transcode_etc1s_etc2",
  "transcode_uastc",
  "transcode_uastc_hdr",
  "transcode_xuastc",
]
transcode_astc = ["basisu_c_sys/transcode_astc"]
transcode_etc1s_bc1 = ["basisu_c_sys/transcode_etc1s_bc1"]
transcode_etc1s_bc3 = ["basisu_c_sys/transcode_etc1s_bc3"]
transcode_etc1s_bc4_5 = ["basisu_c_sys/transcode_etc1s_bc4_5"]
transcode_etc1s_bc7 = ["basisu_c_sys/transcode_etc1s_bc7"]
transcode_etc1s_etc2 = ["basisu_c_sys/transcode_etc1s_etc2"]
transcode_uastc = ["basisu_c_sys/transcode_uastc"]
transcode_uastc_hdr = ["basisu_c_sys/transcode_uastc_hdr"]
transcode_xuastc = ["basisu_c_sys/transcode_xuastc"]

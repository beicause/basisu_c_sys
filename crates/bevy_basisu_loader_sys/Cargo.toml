[package]
name = "bevy_basisu_loader_sys"
version = "0.4.4"
edition = "2024"
repository.workspace = true
license.workspace = true
description = "A high level rust wrapper around the Basis Universal transcoder library"
keywords = ["basis-universal", "ffi", "transcoder"]
include = ["vendor/", "wasm/", "build.rs", "src/*.rs", "README.md"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
build-wasm-cli = ["dep:clap"]

[dependencies]
async-lock = "3.4.2"
clap = { version = "4.5", features = ["derive"], optional = true }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[build-dependencies]
cc = "1.2"
bindgen = "0.72"

[[bin]]
name = "build-wasm-cli"
path = "src/bin/build_wasm_cli.rs"
required-features = ["build-wasm-cli"]

[dev-dependencies]
insta = "1.47.1"

[package]
name = "basisu_c_sys"
version = "0.4.0"
edition = "2024"
repository.workspace = true
license.workspace = true
description = "Raw Rust ffi binding for the Basis Universal pure C API"
keywords = ["basis-universal", "ffi"]
include = ["vendor/basis_universal", "build.rs", "README.md", "src/*.rs"]

[features]
default = []
encoder = []
serde = ["dep:serde"]
__build-wasm-cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0.228", optional = true, default-features = false, features = [
  "derive",
] }


[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = "0.72"
syn = { version = "2.0.117", default-features = false, features = [
  "full",
  "parsing",
  "printing",
] }
prettyplease = "0.2.37"

[[bin]]
name = "build-wasm-cli"
path = "bin/build_wasm_cli.rs"
required-features = ["__build-wasm-cli"]

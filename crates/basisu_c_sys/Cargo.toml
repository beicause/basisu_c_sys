[package]
name = "basisu_c_sys"
version = "0.7.0"
edition = "2024"
repository.workspace = true
license.workspace = true
description = "Raw Rust binding for the Basis Universal pure C API"
keywords = ["basis-universal", "ffi", "wasm-bindgen"]
include = [
  "vendor/basis_universal",
  "build.rs",
  "README.md",
  "src/*.rs",
  "src/extra/*.rs",
  "wasm/*",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
features = ["encoder", "serde", "extra"]

[features]
default = []
encoder = []
extra = ["dep:wgpu-types", "dep:async-lock", "dep:thiserror", "dep:bitflags"]
serde = ["dep:serde"]
__gen_make_wasm = ["dep:clap"]

[dependencies]
async-lock = { version = "3.4.2", default-features = false, optional = true }
bitflags = { version = "2.11.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0.228", optional = true, default-features = false, features = [
  "derive",
] }
thiserror = { version = "2.0.18", optional = true, default-features = false }
wgpu-types = { version = "29.0", optional = true, default-features = false }
bytemuck = { version = "1.25.0", default-features = false }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
async-lock = { version = "3.4.2", default-features = false }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = "0.72"
syn = { version = "2.0.117", default-features = false, features = [
  "full",
  "parsing",
  "printing",
] }
prettyplease = "0.2.37"

[dev-dependencies]
half = { version = "2.7.1", default-features = false, features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "exr",
  "webp",
] }
insta = "1.47.2"

[[bin]]
name = "gen_make_wasm"
path = "bin/gen_make_wasm.rs"
required-features = ["__gen_make_wasm"]

[[test]]
name = "encoder"
path = "tests/encoder.rs"
required-features = ["extra", "encoder"]

[[test]]
name = "transcoder"
path = "tests/transcoder.rs"
required-features = ["extra"]

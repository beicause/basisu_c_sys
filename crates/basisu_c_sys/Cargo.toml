[package]
name = "basisu_c_sys"
version = "0.9.0-dev"
edition = "2024"
description = "Rust binding and wrappers for Basis Universal C API"
repository.workspace = true
license.workspace = true
keywords = ["basis-universal", "ffi", "texture", "wasm"]
include = [
  "CHANGELOG.md",
  "README.md",
  "build.rs",
  "examples/",
  "src/",
  "vendored/",
  "wasm_libc.rs",
  "wasm_libcxx.rs",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
no-default-features = true
features = [
  "encoder",
  "serde",
  "extra",
]
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "transcoder"
path = "tests/transcoder.rs"
required-features = ["extra", "transcode_default"]

[[test]]
name = "encoder"
path = "tests/encoder.rs"
required-features = ["encoder", "extra", "transcode_default"]

# The wasm test target has `harness = false`: the libtest harness cannot
# report pass/fail on wasm32-unknown-unknown (std stubs stdout and
# `process::exit`), so it has a custom entry point (`_start` on wasm) that
# traps on failure, which wasmtime reports with a non-zero exit code.
[[test]]
harness = false
name = "wasm"
path = "tests/wasm.rs"
required-features = ["encoder", "extra"]

[dependencies]
bitflags = { version = "2.11.0", optional = true }
serde = {
  version = "1.0.228",
  default-features = false,
  features = [
    "derive",
  ],
  optional = true
}
spin = {
  version = "0.12",
  default-features = false,
  features = ["once"],
}
thiserror = { version = "2.0.18", default-features = false, optional = true }

[dev-dependencies]
half = { version = "2.7.1", default-features = false }
image = {
  version = "0.25.10",
  default-features = false,
  features = [
    "exr",
    "jpeg",
    "png",
    "webp",
  ]
}
insta = "1.47.2"

[build-dependencies]
bindgen = "0.72"
cc = { version = "1.2", features = ["parallel"] }

[target.'cfg(not(target_has_atomic = "8"))'.dependencies]
spin = {
  version = "0.12",
  default-features = false,
  features = [
    "portable-atomic",
  ]
}

[features]
default = ["std", "transcode_default"]
encoder = []
extra = [
  "dep:bitflags",
  "dep:thiserror",
]
serde = ["dep:serde"]
std = []

transcode_default = [
  "transcode_astc",
  "transcode_etc1s_bc4_5",
  "transcode_etc1s_bc7",
  "transcode_etc1s_etc2",
  "transcode_uastc",
  "transcode_uastc_hdr",
  "transcode_xuastc",
]

transcode_astc = []
transcode_etc1s_bc1 = []
transcode_etc1s_bc3 = ["transcode_etc1s_bc1", "transcode_etc1s_bc4_5"]
transcode_etc1s_bc4_5 = []
transcode_etc1s_bc7 = []
transcode_etc1s_etc2 = []
transcode_uastc = []
transcode_uastc_hdr = []
transcode_xuastc = []

[lints]
workspace = true

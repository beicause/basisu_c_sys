[files]
extend-exclude = [
  "*.pbxproj",  # metadata file
  "*.patch",  # Automatically generated files that should not be manually modified.
  "*.bin",  # Binary files
  ".git/",  # Version control files
  "3rdparty/",
  "vendored/",
]
ignore-hidden = false

[default]
locale = "en-us"
extend-words = { "Spectre" = "Spectre" }

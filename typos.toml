[files]
extend-exclude = [
  "*.pbxproj",                  # metadata file
  "*.patch",                    # Automatically generated files that should not be manually modified.
  "*.bin",                      # Binary files
  ".git/",                      # Version control files
  "vendor/basis_universal/*",   # BasisU source code
  "crates/basisu_c_sys/wasm/*", # BasisU prebuilt wasm
]
ignore-hidden = false

[default]
locale = "en-us"

[default.extend-words]
ba = "ba"
